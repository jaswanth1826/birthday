<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Unlock the Surprise 🎁</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Unlock Your Birthday Surprise 🎁</h1>
      <p>Enter your Date of Birth to continue</p>

      <div class="inputRow">
        <input id="dob" type="text" placeholder="DD-MM-YYYY (example: 01-01-2000)" />
        <button onclick="checkDOB()">Unlock</button>
      </div>

      <div id="err" class="err">Oops — wrong DOB. Try again 🙂</div>
      <div class="small">Tip: Use 01-01-2000, 01/01/2000, or YYYY-MM-DD.</div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") checkDOB();
    });
  </script>
</body>
</html>
