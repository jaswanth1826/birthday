<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Birthday Surprise 💕</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .hidden { display: none !important; }
    #slideImg { transition: opacity 0.4s ease-in-out; }
  </style>
</head>
<body class="quotes-page">
  <script>
    if (localStorage.getItem("birthday_access") !== "yes") {
      window.location.href = "./index.html";
    }
  </script>

  <audio id="bgm" loop></audio>

  <!-- ====== SECTION 1: QUOTES ====== -->
  <section id="quotesSection">
    <div class="sky">
      <div class="sun"></div>
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="cloud cloud-3"></div>

      <div class="bird bird-1">🐦</div>
      <div class="bird bird-2">🕊️</div>
      <div class="bird bird-3">🐦</div>
      <div class="bird bird-4">🕊️</div>
      <div class="bird bird-5">🐦</div>

      <div class="flower flower-1">🌸</div>
      <div class="flower flower-2">🌺</div>
      <div class="flower flower-3">🌷</div>
      <div class="flower flower-4">🌼</div>
      <div class="flower flower-5">🌸</div>
      <div class="flower flower-6">🌺</div>
      <div class="flower flower-7">🌷</div>
      <div class="flower flower-8">🌼</div>
    </div>

    <div class="quotes-container">
      <h1 class="quote main-quote">Hi Bangaram 💕</h1>
      <p class="quote sub-quote">You light up my world</p>
      <p class="quote sub-quote">Every moment with you is magical</p>
      <p class="quote sub-quote">So grateful for you</p>
      <p class="quote sub-quote">Happy Birthday, my love ✨</p>

      <button id="nextBtn" class="next-btn" style="display:none;">
        Inka entha sepu chusthav? Next page ki vellava 😌👉
      </button>
    </div>
  </section>

  <!-- ====== SECTION 2: SLIDESHOW ====== -->
  <section id="slideshowSection" class="hidden">
    <div class="wrap slideshow-wrap">
      <div class="card">
        <h1>Our Memories 💕</h1>
        <div class="slideshowFrame">
          <img id="slideImg" class="photo" src="./photos/1.jpg" alt="memory" />
        </div>
        <p class="small">💞</p>
      </div>
    </div>
  </section>

  <script>
    const images = [
      "./photos/1.jpg",
      "./photos/2.jpg",
      "./photos/3.jpg",
      "./photos/4.jpg",
      "./photos/5.jpg"
    ];

    const songs = [
      "./music.mp3",
      "./music/Nene Kani Nenai Undaga-SenSongsMp3.Co.mp3"
    ];

    const nextBtn = document.getElementById("nextBtn");
    const quotesSection = document.getElementById("quotesSection");
    const slideshowSection = document.getElementById("slideshowSection");
    const slideImg = document.getElementById("slideImg");
    const bgm = document.getElementById("bgm");

    setTimeout(() => {
      nextBtn.style.display = "inline-block";
    }, 15000);

    let i = 0;
    function nextImage() {
      i = (i + 1) % images.length;
      slideImg.style.opacity = 0;
      setTimeout(() => {
        slideImg.src = images[i];
        slideImg.onload = () => slideImg.style.opacity = 1;
      }, 300);
    }

    function startSlideshow() {
      setInterval(nextImage, 3000);
    }

    function startMusic() {
      const pick = songs[Math.floor(Math.random() * songs.length)];
      bgm.src = encodeURI(pick);
      bgm.volume = 0.65;
      bgm.play().catch(() => {});
    }

    nextBtn.addEventListener("click", () => {
      startMusic();
      quotesSection.classList.add("hidden");
      slideshowSection.classList.remove("hidden");
      startSlideshow();
    });
  </script>
</body>
</html>
